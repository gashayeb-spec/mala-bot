<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ክፍያ መፈጸሚያ ገጽ</title>
    <!-- የቴሌግራም ዌብ አፕ ስክሪፕት -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #2b547e;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        input:focus {
            border-color: #2b547e;
            outline: none;
        }
        button {
            background-color: #2b547e;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1f3d5c;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>ክፍያ መፈጸሚያ</h2>
        <form id="paymentForm">
            <div class="form-group">
                <label for="phone">ስልክ ቁጥር:</label>
                <input type="text" id="phone" placeholder="09xxxxxxxx" required>
            </div>
            <div class="form-group">
                <label for="amount">የገንዘብ መጠን (ብር):</label>
                <input type="number" id="amount" placeholder="ምሳሌ: 100" required>
            </div>
            <button type="submit" id="payButton">ክፍያ ፈጽም</button>
        </form>
    </div>

    <script>
        // የቴሌግራም ዌብ አፕ አካባቢን ማስተካከል
        let tg = window.Telegram.WebApp;
        tg.expand();

        document.getElementById('paymentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const phone = document.getElementById('phone').value;
            const amount = document.getElementById('amount').value;

            fetch('/api/pay', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ phone: phone, amount: amount })
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
                tg.close(); // ስራው ሲጠናቀቅ ቦቱን መዝጋት
            })
            .catch(error => {
                console.error('Error:', error);
                alert('ክፍያውን ማስተላለፍ አልተቻለም።');
            });
        });
    </script>
</body>
</html>
