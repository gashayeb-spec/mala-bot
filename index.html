<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Premium ግዢ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-primary: #ffffff;
            --text-secondary: #8b949e;
            --accent-color: #2f81f7;
            --border-color: #30363d;
            --success-color: #238636;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 16px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }

        h2 {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--text-primary);
        }

        .package-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .package-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .package-card.selected {
            border-color: var(--accent-color);
            background: rgba(47, 129, 247, 0.15);
        }

        .package-card h4 {
            margin: 0 0 6px 0;
            font-size: 15px;
        }

        .package-card p {
            margin: 0;
            font-size: 14px;
            color: var(--accent-color);
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-group input {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-primary);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent-color);
        }

        .eye-icon {
            position: absolute;
            right: 12px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 18px;
            user-select: none;
        }

        .hint {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background: #1f6feb;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h2>💎 Telegram Premium ግዢ</h2>
            <p style="color:var(--text-secondary); font-size:13px; margin-top:0;">የሚፈልጉትን የቆይታ ጊዜ ፓኬጅ ይምረጡ</p>
            
            <!-- የፓኬጅ ምርጫዎች -->
            <div class="package-grid">
                <div class="package-card selected" onclick="selectPackage(this, '1 ወር', 1399)">
                    <h4>1 ወር</h4>
                    <p>1,399 ETB</p>
                </div>
                <div class="package-card" onclick="selectPackage(this, '3 ወር', 3599)">
                    <h4>3 ወር</h4>
                    <p>3,599 ETB</p>
                </div>
                <div class="package-card" onclick="selectPackage(this, '6 ወር', 5899)">
                    <h4>6 ወር</h4>
                    <p>5,899 ETB</p>
                </div>
                <div class="package-card" onclick="selectPackage(this, '1 ዓመት', 8900)">
                    <h4>1 ዓመት</h4>
                    <p>8,900 ETB</p>
                </div>
            </div>

            <!-- ዩዘርነም -->
            <div class="form-group">
                <label>የተቀባይ ቴሌግራም ዩዘርነም</label>
                <input type="text" id="recipientUser" placeholder="@username">
            </div>

            <!-- ስልክ ቁጥር (09 ወይም 07) -->
            <div class="form-group">
                <label>ስልክ ቁጥር (Ethio Telecom / Safaricom)</label>
                <input type="tel" id="phoneNumber" placeholder="09xxxxxxxx ወይም 07xxxxxxxx" maxlength="10">
                <div class="hint">በ 09 ወይም በ 07 የሚጀምር 10 አኃዝ ቁጥር ያስገቡ</div>
            </div>

            <!-- ፒን ኮድ -->
            <div class="form-group">
                <label>የደህንነት ፒን (PIN Lock - 4 አኃዝ)</label>
                <div class="input-wrapper">
                    <input type="password" id="userPin" placeholder="****" maxlength="4">
                    <span class="eye-icon" id="togglePin" onclick="togglePinVisibility()">👁️‍🗨️</span>
                </div>
            </div>

            <!-- ማረጋገጫ እና ክፍያ ቁልፍ -->
            <button class="btn-primary" onclick="confirmAndPay()">ኮንፊርም (Confirm) እና ክፈል →</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let selectedPackageName = "1 ወር";
        let selectedAmount = 1399;

        // የቴሌግራም ዩዘርነም በራሱ እንዲሞላ ማድረግ
        window.addEventListener('DOMContentLoaded', () => {
            const user = tg.initDataUnsafe?.user || {};
            const usernameField = document.getElementById('recipientUser');
            if (user.username) {
                usernameField.value = "@" + user.username;
            } else if (user.first_name) {
                usernameField.value = user.first_name;
            } else {
                usernameField.value = "@User_Mala";
            }
        });

        function selectPackage(element, packageName, price) {
            document.querySelectorAll('.package-card').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedPackageName = packageName;
            selectedAmount = price;
        }

        function togglePinVisibility() {
            const pinInput = document.getElementById('userPin');
            const toggleIcon = document.getElementById('togglePin');
            
            if (pinInput.type === 'password') {
                pinInput.type = 'text';
                toggleIcon.textContent = '👁️'; 
            } else {
                pinInput.type = 'password';
                toggleIcon.textContent = '👁️‍🗨️'; 
            }
        }

        async function confirmAndPay() {
            const recipient = document.getElementById('recipientUser').value.trim();
            const phone = document.getElementById('phoneNumber').value.trim();
            const pin = document.getElementById('userPin').value.trim();

            if (!recipient) {
                alert('እባክዎ የተጠቃሚ ስም (Username) ያስገቡ!');
                return;
            }

            // ስልክ ቁጥር ማረጋገጫ (09 ወይም 07 መጀመሩን ማረጋገጥ)
            const phoneRegex = /^(09|07)\d{8}$/;
            if (!phoneRegex.test(phone)) {
                alert('ስልክ ቁጥሩ ትክክለ አይደለም! በ 09 ወይም በ 07 የሚጀምር 10 አኃዝ ቁጥር ብቻ ያስገቡ (ለምሳሌ: 0912345678)።');
                return;
            }

            if (!pin || pin.length < 4) {
                alert('እባክዎ 4 አኃዝ የደህንነት ፒን (PIN) ያስገቡ!');
                return;
            }

            const user = tg.initDataUnsafe?.user || {};
            
            // የኮንፊርም ማረጋገጫ መስኮት
            const isConfirmed = confirm(`እባክዎ መረጃዎን ያረጋግጡ:\n\n📦 ፓኬጅ: Telegram Premium (${selectedPackageName})\n💰 ዋጋ: ${selectedAmount} ETB\n👤 ተቀባይ: ${recipient}\n📞 ስልክ: ${phone}\n\nግዢውን ለመፈጸም OK ይጫኑ።`);
            
            if (!isConfirmed) return;

            try {
                let response = await fetch('/api/pay', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        amount: selectedAmount,
                        telegram_id: user.id || 12345678,
                        first_name: user.first_name || "Gashaye",
                        last_name: user.last_name || "Bejigu",
                        recipient: recipient,
                        phone_number: phone,
                        package: selectedPackageName,
                        pin: pin
                    })
                });
                let data = await response.json();
                
                if(data.data && data.data.checkout_url) {
                    window.location.href = data.data.checkout_url;
                } else {
                    alert('የክፍያ ሊንክ ማመንጨት አልተቻለም። እባክዎ እንደገና ይሞክሩ።');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('የኔትወርክ ስህተት ተፈጥሯል እባክዎ እንደገና ይሞክሩ።');
            }
        }
    </script>
</body>
</html>
