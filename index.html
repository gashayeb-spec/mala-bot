<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mela-bot Mini App</title>
    <!-- የቴሌግራም ዌብ አፕ ጃቫስክሪፕት ቤተ-መጽሐፍት -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 24px;
            margin: 5px 0;
            color: #ffffff;
        }
        .header p {
            font-size: 14px;
            color: #a0a0a0;
            margin: 0;
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 500px;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 16px;
            padding: 15px;
            text-align: left;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid #2c2c2c;
        }
        .card:hover {
            transform: translateY(-2px);
            border-color: #3e3e3e;
        }
        .card h3 {
            font-size: 15px;
            margin: 10px 0 5px 0;
            color: #ffffff;
        }
        .card p {
            font-size: 11px;
            color: #888888;
            margin: 0;
            line-height: 1.3;
        }
        .icon {
            font-size: 22px;
        }
        .full-width {
            grid-column: span 2;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Mela-bot</h1>
        <p>Social growth & premium services</p>
    </div>

    <div class="grid-container">
        <!-- Social Media -->
        <div class="card" onclick="selectService('Social Media')">
            <div class="icon">📈</div>
            <h3>Social Media</h3>
            <p>Grow followers, likes, and views</p>
        </div>

        <!-- TikTok Coins -->
        <div class="card" onclick="selectService('TikTok Coins')">
            <div class="icon">🪙</div>
            <h3>TikTok Coins</h3>
            <p>Top up creator balances</p>
        </div>

        <!-- Telegram Premium -->
        <div class="card" onclick="selectService('Telegram Premium')">
            <div class="icon">💎</div>
            <h3>Telegram Premium</h3>
            <p>Upgrade to premium</p>
        </div>

        <!-- Telegram Stars -->
        <div class="card" onclick="selectService('Telegram Stars')">
            <div class="icon">⭐</div>
            <h3>Telegram Stars</h3>
            <p>Send stars to any account</p>
        </div>

        <!-- Snapchat Plus -->
        <div class="card full-width" onclick="selectService('Snapchat Plus')">
            <div class="icon">👻</div>
            <h3>Snapchat Plus</h3>
            <p>Unlock exclusive Snapchat features</p>
        </div>
    </div>

    <script>
        // የቴሌግራም ዌብ አፕ አጠቃቀምን ማስተካከል
        let tg = window.Telegram.WebApp;
        tg.expand();

        function selectService(serviceName) {
            // ተጠቃሚው አገልግሎቱን ሲመርጥ የሚደረግ ተግባር
            tg.sendData(JSON.stringify({ "selected_service": serviceName }));
            // ወይም ለጊዜው ማሳወቂያ ማሳየት ይቻላል
            alert(serviceName + " ተመርጧል!");
        }
    </script>
</body>
</html>
