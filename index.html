<!DOCTYPE html>
<html lang="am" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>መላ ቦት - Telegram Mini App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0f1016; color: #ffffff; font-family: sans-serif; }
    </style>
</head>
<body class="min-h-screen pb-20 flex flex-col justify-between">
    <header class="p-4 flex items-center justify-between border-b border-gray-800">
        <div class="flex items-center space-x-2">
            <span class="text-xl font-bold text-purple-400">መላ ቦት</span>
            <span class="text-xs bg-gray-800 text-gray-300 px-2 py-0.5 rounded-full">mini app</span>
        </div>
        <div id="user-profile" class="text-sm text-gray-400">
            <span id="username-display">Loading...</span>
        </div>
    </header>

    <main class="p-4 space-y-4 max-w-md mx-auto w-full">
        <h1 class="text-xl font-bold">እንኳን ደህና መጡ! 🚀</h1>
        
        <div onclick="selectService('Telegram Stars')" class="bg-[#1a1b26] border border-gray-800 p-4 rounded-2xl cursor-pointer hover:border-purple-500 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">⭐</span>
                <div>
                    <h2 class="font-bold text-sm">Telegram Stars</h2>
                    <p class="text-xs text-gray-400">Send stars to any account</p>
                </div>
            </div>
            <span>→</span>
        </div>
    </main>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('username-display').textContent = user.username ? `@${user.username}` : user.first_name;
        } else {
            document.getElementById('username-display').textContent = "@Guest_User";
        }

        function selectService(serviceName) {
            if (serviceName === 'Telegram Stars') {
                window.location.href = 'packages.html';
            }
        }
    </script>
</body>
</html>
