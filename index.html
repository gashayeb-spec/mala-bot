<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOKETI KURT & LOUNGE - የዕቁብ እና ዋስትና መቆጣጠሪያ</title>
<style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0b1f36; display: flex; justify-content: center; padding: 20px; margin: 0; }
    .form-container { background-color: #ffffff; width: 100%; max-width: 450px; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .header { text-align: center; margin-bottom: 25px; border-bottom: 3px double #0b2545; padding-bottom: 12px; }
    .header h2 { margin: 0; font-size: 22px; color: #0b2545; font-weight: 800; }
    .header .subtitle { margin: 5px 0 0 0; font-size: 15px; color: #d93025; font-weight: bold; }
    
    .section-title { background-color: #f0f4f8; color: #0b2545; padding: 8px; font-weight: bold; font-size: 14px; margin: 20px 0 10px 0; border-left: 4px solid #0b2545; border-radius: 0 4px 4px 0; }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 700; font-size: 13.5px; color: #111; margin-bottom: 6px; }
    input[type="text"], input[type="number"], select { width: 100%; padding: 11px; border: 1px solid #d1d5db; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
    
    .bank-info-box {
        background: #f8f9fa;
        border: 1px dashed #0b2545;
        padding: 12px;
        border-radius: 6px;
        font-size: 12.5px;
        margin-bottom: 15px;
        color: #0b2545;
        line-height: 1.6;
    }

    .row-group { display: flex; gap: 10px; }
    .row-group .form-group { flex: 1; }

    .checkbox-group { display: flex; align-items: center; gap: 10px; background-color: #f8f9fa; padding: 12px; border-radius: 4px; border: 1px dashed #0b2545; margin-top: 15px; }
    .checkbox-group input { width: 20px; height: 20px; }
    .checkbox-group label { margin: 0; font-size: 13px; color: #0b2545; }
    
    .submit-btn { width: 100%; padding: 14px; background-color: #0b2545; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; }
    .submit-btn:hover { background-color: #133863; }
</style>
</head>
<body>

<div class="form-container">
    <div class="header">
        <h2>KOKETI KURT & LOUNGE</h2>
        <div class="subtitle">ዲጂታል የዕቁብና ዋስትና መቆጣጠሪያ</div>
    </div>
    
    <div class="bank-info-box">
        <b>የባንክ አካውንቶች (ስም: ጋሻዬ በእጅጉ ሄርጎ)፦</b><br>
        • ቴሌብር: <b>0916039015</b><br>
        • ንግድ ባንክ: <b>100070780201</b><br>
        • አቢሲኒያ: <b>54071628</b><br>
        • ንብ ባንክ: <b>7000106022734</b><br>
        • ዳሽን ባንክ: <b>5121355332011</b>
    </div>

    <form id="equbForm">
        <!-- 1. የዕቁብተኛው መረጃ -->
        <div class="section-title">፩. የዕቁብተኛው መረጃ (Member Info)</div>
        <div class="form-group">
            <label>ሙሉ ስም (Full Name)</label>
            <input type="text" id="fullName" placeholder="የእቁብተኛውን ስም ያስገቡ" required>
        </div>
        <div class="form-group">
            <label>ስልክ ቁጥር (Phone Number)</label>
            <input type="text" id="phone" placeholder="0912345678" required>
        </div>
        <div class="form-group">
            <label>የእቁብተኛው የቼክ ቁጥር (Member Cheque No.)</label>
            <input type="text" id="chequeNo" placeholder="ካለው የቼክ ቁጥር ያስገቡ">
        </div>

        <!-- 2. የዕቁብ የገንዘብ ሂሳብ መቆጣጠሪያ -->
        <div class="section-title">፪. የዕቁብ የገንዘብ ሁኔታ እና ዙር</div>
        <div class="form-group">
            <label>የዕቁብ ዙር መጠን (Equb Cycle Amount)</label>
            <select id="cycleAmount" required>
                <option value="">-- የብር መጠን ይምረጡ --</option>
                <option value="10000">10,000 ብር</option>
                <option value="20000">20,000 ብር</option>
                <option value="50000">50,000 ብር</option>
                <option value="100000">100,000 ብር</option>
            </select>
        </div>
        <div class="row-group">
            <div class="form-group">
                <label>እስካሁን የጣለው (Paid Amount)</label>
                <input type="number" id="paidAmount" placeholder="በብር" required>
            </div>
            <div class="form-group">
                <label>ቀሪ እዳ (Remaining Due)</label>
                <input type="number" id="remainingDue" placeholder="በብር" required>
            </div>
        </div>
        <div class="form-group">
            <label>የአሁን የዕቁብ ሳምንት / ዙር (Current Week)</label>
            <select id="currentWeek" required>
                <!-- ከ 1 እስከ 110 ሳምንታት በራስ-ሰር የሚሞላ -->
            </select>
        </div>

        <!-- 3. የዋስትና መረጃ -->
        <div class="section-title">፫. የዋስትና እና የዋስ መረጃ (Guarantor & Collateral)</div>
        <div class="form-group">
            <label>የዋስ ሙሉ ስም (Guarantor Name)</label>
            <input type="text" id="guarantorName" placeholder="የዋስ ሙሉ ስም ያስገቡ">
        </div>
        <div class="row-group">
            <div class="form-group">
                <label>የዋስ የቼክ ቁጥር</label>
                <input type="text" id="guarantorCheque" placeholder="የዋስ ቼክ ቁጥር">
            </div>
            <div class="form-group">
                <label>በዋስትና የሚያዘው ንብረት</label>
                <input type="text" id="collateral" placeholder="ለምሳሌ፡ መኪና፣ ቤት ወዘተ">
            </div>
        </div>

        <div class="form-group checkbox-group">
            <input type="checkbox" id="sms_notify" checked>
            <label for="sms_notify"><strong>ሳምንታዊ አላርት እና ኤስኤምኤስ ይላክ፦</strong> ምዝገባው ሲያልቅ እና ሳምንታዊ ክፍያ ሲደርስ ማስታወሻ ይላክ።</label>
        </div>

        <button type="button" class="submit-btn" onclick="submitEqubData()">ክፍያ ፈጽመው መረጃውን መዝግብ</button>
    </form>
</div>

<script>
    // ሳምንታትን ከ 1 እስከ 110 በራስ-ሰር መሙላት
    window.onload = function() {
        const weekSelect = document.getElementById('currentWeek');
        for(let i = 1; i <= 110; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.innerText = `ሳምንት ${i} (ከ 110)`;
            weekSelect.appendChild(opt);
        }
    };

    async function submitEqubData() {
        const data = {
            full_name: document.getElementById('fullName').value,
            phone: document.getElementById('phone').value,
            cheque_no: document.getElementById('chequeNo').value,
            cycle_amount: parseFloat(document.getElementById('cycleAmount').value) || 0,
            paid_amount: parseFloat(document.getElementById('paidAmount').value) || 0,
            remaining_due: parseFloat(document.getElementById('remainingDue').value) || 0,
            guarantor_name: document.getElementById('guarantorName').value,
            guarantor_cheque: document.getElementById('guarantorCheque').value,
            collateral: document.getElementById('collateral').value,
            current_week: parseInt(document.getElementById('currentWeek').value)
        };

        if(!data.full_name || !data.phone) {
            alert('እባክዎ ስም እና ስልክ ቁጥር ያስገቡ!');
            return;
        }

        try {
            const response = await fetch('/api/register-equb', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            if(result.status === 'success') {
                alert('የእቁብ መረጃዎ እና የክፍያ ጥያቄዎ በተሳካ ሁኔታ ተመዝግቦ ለአድሚን ተልኳል!');
                document.getElementById('equbForm').reset();
            } else {
                alert('ስህተት ተፈጥሯል፣ እባክዎ እንደገና ይሞክሩ።');
            }
        } catch(e) {
            alert('የኔትወርክ ስህተት አጋጥሟል!');
        }
    }
</script>

</body>
</html>
