<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የዋሌት ምዝገባ እና ቴሌግራም ፕሪሚየም</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-primary: #ffffff;
            --text-secondary: #8b949e;
            --accent-color: #2f81f7;
            --border-color: #30363d;
            --success-color: #238636;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 16px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }

        h2 {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--text-primary);
        }

        .package-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .package-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .package-card.selected {
            border-color: var(--accent-color);
            background: rgba(47, 129, 247, 0.15);
        }

        .package-card h4 {
            margin: 0 0 4px 0;
            font-size: 14px;
        }

        .package-card p {
            margin: 0;
            font-size: 13px;
            color: var(--accent-color);
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-group input {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-primary);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent-color);
        }

        .eye-icon {
            position: absolute;
            right: 12px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 16px;
            user-select: none;
        }

        .hint {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .bank-box {
            background: rgba(35, 134, 54, 0.1);
            border: 1px solid var(--success-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 12px;
            color: #3fb950;
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background: #1f6feb;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h2>🏦 የዋሌት ምዝገባ እና ቴሌግራም ፕሪሚየም</h2>
            
            <div class="bank-box">
                <b>ኦፊሴላዊ የባንክ ሂሳብ መረጃ:</b><br>
                • ባንክ: CBE / ብሔራዊ ባንክ<br>
                • ሂሳብ ቁጥር: <b>100070780201</b><br>
                • ባለቤት: <b>ጋሻዬ በጅጉ ሄሪጎ</b>
            </div>

            <!-- 1. ሙሉ ስም -->
            <div class="form-group">
                <label>ሙሉ ስምዎ (ከባንክ አካውንት ጋር የሚመሳሰል)</label>
                <input type="text" id="fullName" placeholder="ለምሳሌ፦ ጋሻዬ በጅጉ">
            </div>

            <!-- 2. ስልክ ቁጥር -->
            <div class="form-group">
                <label>ስልክ ቁጥር (Ethio Telecom / Safaricom)</label>
                <input type="tel" id="phoneNumber" placeholder="09xxxxxxxx ወይም 07xxxxxxxx" maxlength="10">
                <div class="hint">በ 09 ወይም በ 07 የሚጀምር 10 አኃዝ ቁጥር ያስገቡ</div>
            </div>

            <!-- 3. የባንክ አድራሻ ቁጥር -->
            <div class="form-group">
                <label>የባንክ አካውንት ቁጥርዎ</label>
                <input type="text" id="bankAddress" placeholder="የባንክ ቁጥርዎ">
            </div>

            <!-- 4. ፒን ኮድ (Pin Creation) -->
            <div class="form-group">
                <label>የደህንነት ፒን ይፍጠሩ (4 አኃዝ)</label>
                <div class="input-wrapper">
                    <input type="password" id="userPin" placeholder="****" maxlength="4">
                    <span class="eye-icon" onclick="toggleVisibility('userPin', this)">👁️‍🗨️</span>
                </div>
            </div>

            <!-- 5. ፒን ኮድ ማረጋገጫ (Re-enter Pin) -->
            <div class="form-group">
                <label>ፒን ኮዱን እንደገና ይጻፉ (Confirm PIN)</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPin" placeholder="****" maxlength="4">
                    <span class="eye-icon" onclick="toggleVisibility('confirmPin', this)">👁️‍🗨️</span>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">

            <h2>💎 የቴሌግራም ፕሪሚየም ፓኬጅ ይምረጡ</h2>
            <div class="package-grid">
                <div class="package-card selected" onclick="selectPackage(this, '1 ወር', 1399)">
                    <h4>1 ወር</h4>
                    <p>1,399 ETB</p>
                </div>
                <div class="package-card" onclick="selectPackage(this, '3 ወር', 3599)">
                    <h4>3 ወር</h4>
                    <p>3,599 ETB</p>
                </div>
                <div class="package-card" onclick="selectPackage(this, '6 ወር', 5899)">
                    <h4>6 ወር</h4>
                    <p>5,899 ETB</p>
                </div>
                <div class="package-card" onclick="selectPackage(this, '1 ዓመት', 8900)">
                    <h4>1 ዓመት</h4>
                    <p>8,900 ETB</p>
                </div>
            </div>

            <div class="form-group">
                <label>የተቀባይ ቴሌግራም ዩዘርነም</label>
                <input type="text" id="recipientUser" placeholder="@username">
            </div>

            <button class="btn-primary" onclick="registerAndPay()">ዎሌት መዝግብ እና ክፈል →</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let selectedPackageName = "1 ወር";
        let selectedAmount = 1399;

        window.addEventListener('DOMContentLoaded', () => {
            const user = tg.initDataUnsafe?.user || {};
            const usernameField = document.getElementById('recipientUser');
            const nameField = document.getElementById('fullName');
            
            if (user.username) {
                usernameField.value = "@" + user.username;
            } else {
                usernameField.value = "@User_Mala";
            }

            if (user.first_name) {
                nameField.value = user.first_name + (user.last_name ? " " + user.last_name : "");
            }
        });

        function selectPackage(element, packageName, price) {
            document.querySelectorAll('.package-card').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedPackageName = packageName;
            selectedAmount = price;
        }

        function toggleVisibility(fieldId, iconEl) {
            const inputField = document.getElementById(fieldId);
            if (inputField.type === 'password') {
                inputField.type = 'text';
                iconEl.textContent = '👁️';
            } else {
                inputField.type = 'password';
                iconEl.textContent = '👁️‍🗨️';
            }
        }

        async function registerAndPay() {
            const fullName = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phoneNumber').value.trim();
            const bankAddress = document.getElementById('bankAddress').value.trim();
            const pin = document.getElementById('userPin').value.trim();
            const confirmPin = document.getElementById('confirmPin').value.trim();
            const recipient = document.getElementById('recipientUser').value.trim();

            if (!fullName) {
                alert('እባክዎ ሙሉ ስምዎን ያስገቡ!');
                return;
            }

            const phoneRegex = /^(09|07)\d{8}$/;
            if (!phoneRegex.test(phone)) {
                alert('ስልክ ቁጥሩ ትክክለ አይደለም! በ 09 ወይም በ 07 የሚጀምር 10 አኃዝ ቁጥር ብቻ ያስገቡ።');
                return;
            }

            if (!bankAddress) {
                alert('እባክዎ የባንክ አካውንት ቁጥርዎን ያስገቡ!');
                return;
            }

            if (!pin || pin.length < 4) {
                alert('እባክዎ 4 አኃዝ የደህንነት ፒን (PIN) ያስገቡ!');
                return;
            }

            if (pin !== confirmPin) {
                alert('ያስገቧቸው ሁለቱ ፒን ቁጥሮች እርስ በእርስ አልተመሳሰሉም! እባክዎ እንደገና ያረጋግጡ።');
                return;
            }

            if (!recipient) {
                alert('እባክዎ የተቀባይ ቴሌግራም ዩዘርነም ያስገቡ!');
                return;
            }

            const user = tg.initDataUnsafe?.user || {};

            const isConfirmed = confirm(
                `እባክዎ መረጃዎን ያረጋግጡ:\n\n` +
                `👤 ስም: ${fullName}\n` +
                `📞 ስልክ: ${phone}\n` +
                `🏦 ባንክ አድራሻ: ${bankAddress}\n` +
                `📦 ፓኬጅ: Telegram Premium (${selectedPackageName})\n` +
                `💰 ዋጋ: ${selectedAmount} ETB\n` +
                `👤 ተቀባይ: ${recipient}\n\n` +
                `ለማረጋገጥ OK ይጫኑ።`
            );

            if (!isConfirmed) return;

            try {
                let response = await fetch('/api/register-and-pay', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        full_name: fullName,
                        phone_number: phone,
                        bank_address: bankAddress,
                        pin: pin,
                        amount: selectedAmount,
                        telegram_id: user.id || 12345678,
                        recipient: recipient,
                        package: selectedPackageName
                    })
                });
                let data = await response.json();
                
                if(data.data && data.data.checkout_url) {
                    window.location.href = data.data.checkout_url;
                } else {
                    alert(data.message || 'የክፍያ ሊንክ ማመንጨት አልተቻለም። እባክዎ እንደገና ይሞክሩ።');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('የኔትወርክ ስህተት ተፈጥሯል እባክዎ እንደገና ይሞክሩ።');
            }
        }
    </script>
</body>
</html>
