<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mela-bot - Complete Wallet & KYC</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1e293b;
            --primary-color: #4f46e5;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --success-color: #10b981;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
            margin: 16px;
            border: 1px solid var(--border-color);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 12px;
            gap: 10px;
        }

        .top-bar div {
            flex: 1;
        }

        select.pref-select {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
            margin-top: 4px;
        }

        .step { display: none; }
        .step.active { display: block; }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 8px;
            font-size: 20px;
        }

        p.subtitle {
            text-align: center;
            font-size: 13px;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .form-group { margin-bottom: 14px; }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            background: var(--card-bg);
            color: var(--text-color);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }

        .wallet-card {
            background: linear-gradient(135deg, #4f46e5, #818cf8);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
        }

        .wallet-balance {
            font-size: 26px;
            font-weight: bold;
            margin: 10px 0;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .file-upload-box {
            border: 2px dashed var(--border-color);
            padding: 16px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 12px;
        }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- የቋንቋ እና የቀለም (Theme) መቆጣጠሪያዎች -->
    <div class="top-bar">
        <div>
            <label id="langLabel" style="font-size:11px;">ቋንቋ:</label>
            <select id="langSelect" class="pref-select" onchange="changeLanguage()">
                <option value="am">አማርኛ</option>
                <option value="en">English</option>
            </select>
        </div>
        <div>
            <label id="bgThemeLabel" style="font-size:11px;">ባክግራውንድ:</label>
            <select id="bgPicker" class="pref-select" onchange="updateColors()">
                <option value="#ffffff">ነጭ (White)</option>
                <option value="#0f172a">ጥቁር (Black)</option>
                <option value="#eff6ff">ሰማያዊ (Light Blue)</option>
                <option value="#f0fdf4">አረንጓዴ (Light Green)</option>
            </select>
        </div>
        <div>
            <label id="textThemeLabel" style="font-size:11px;">ጽሁፍ ቀለም:</label>
            <select id="textPicker" class="pref-select" onchange="updateColors()">
                <option value="#1e293b">ጥቁር (Black)</option>
                <option value="#ffffff">ነጭ (White)</option>
                <option value="#2563eb">ሰማያዊ (Blue)</option>
                <option value="#dc2626">ቀይ (Red)</option>
            </select>
        </div>
    </div>

    <!-- ክፍል 1፡ ምዝገባ -->
    <div id="step-register" class="step active">
        <h2 id="regTitle">እንኳን ወደ መላ.ቦት በደህና መጡ</h2>
        <p class="subtitle" id="regSubtitle">እባክዎ ትክክለኛ መረጃ በመሙላት ዋሌት ይክፈቱ</p>
        
        <form onsubmit="handleRegister(event)">
            <div class="form-group">
                <label id="lblFirstName">የራሱ ስም (First Name)</label>
                <input type="text" id="firstName" required placeholder="ለምሳሌ፦ ሲቤ">
            </div>
            <div class="form-group">
                <label id="lblFatherName">የአባት ስም (Father's Name)</label>
                <input type="text" id="fatherName" required placeholder="ለምሳሌ፦ ግርማ">
            </div>
            <div class="form-group">
                <label id="lblPhone">ስልክ ቁጥር (Phone Number)</label>
                <input type="tel" id="phoneNumber" required placeholder="+2519xxxxxxxx">
            </div>
            <button type="submit" id="btnNextWallet">ቀጥል & ዋሌት ክፈት</button>
        </form>
    </div>

    <!-- ክፍል 2፡ ኬዋይሲ (KYC) ፎቶ መጫኛ -->
    <div id="step-kyc" class="step">
        <h2 id="kycTitle">የማንነት ማረጋገጫ (KYC)</h2>
        <p class="subtitle" id="kycSubtitle">አካውንትዎ ደህንነቱ የተጠበቀ እንዲሆን መታወቂያ ፊትና ጀርባ ይጫኑ</p>
        
        <form onsubmit="handleKyc(event)">
            <div class="form-group">
                <label id="lblFrontId">የመታወቂያው ፊት (Front Photo)</label>
                <div class="file-upload-box" onclick="document.getElementById('frontId').click()">
                    <span id="frontText">ፎቶ ለመምረጥ እዚህ ይጫኑ</span>
                    <input type="file" id="frontId" accept="image/*" required onchange="updateFileName('frontId', 'frontText')">
                </div>
            </div>

            <div class="form-group">
                <label id="lblBackId">የመታወቂያው ጀርባ (Back Photo)</label>
                <div class="file-upload-box" onclick="document.getElementById('backId').click()">
                    <span id="backText">ፎቶ ለመምረጥ እዚህ ይጫኑ</span>
                    <input type="file" id="backId" accept="image/*" onchange="updateFileName('backId', 'backText')">
                </div>
            </div>

            <button type="submit" id="btnSubmitAdmin">ለአድሚን ማረጋገጫ ላክ</button>
        </form>
    </div>

    <!-- ክፍል 3፡ ማረጋገጫ በመጠበቅ ላይ (Pending) -->
    <div id="step-pending" class="step" style="text-align: center; padding: 10px 0;">
        <h2 id="pendingTitle">ማረጋገጫ በመጠበቅ ላይ...</h2>
        <p class="subtitle" id="pendingSubtitle">መረጃዎ ለአድሚን ተልኳል። ሲረጋገጥ እናሳውቅዎታለን።</p>
        <button onclick="simulatedAdminApprove()" id="btnSimulate" style="background-color: var(--success-color);">[ለሙከራ] ወደ ዋሌት ግባ</button>
    </div>

    <!-- ክፍል 4፡ ዋናው የዋሌት ዳሽቦርድ -->
    <div id="step-wallet" class="step">
        <div class="wallet-card">
            <span class="badge" id="verificationBadge">✅ ቬሪፋይድ ዋሌት</span>
            <div id="txtBalanceTitle">አጠቃላይ ቀሪ ሂሳብ</div>
            <div class="wallet-balance" id="walletBalance">0.00 ETB</div>
            <div style="font-size: 13px; opacity: 0.9;" id="userDisplayName">ተጠቃሚ</div>
        </div>

        <div class="action-buttons">
            <button onclick="openDepositModal()" id="btnDeposit" style="background-color: var(--success-color); margin-top:0;">ገንዘብ አስገባ (Chapa)</button>
            <button onclick="openLotterySection()" id="btnLottery" style="margin-top:0;">ሎተሪ መቁረጥ</button>
        </div>

        <div style="margin-top: 15px;">
            <button onclick="openExchange()" id="btnExchange" style="background-color: #64748b;">መላ ኮይን / ዩኤስዲቲ መቀየሪያ</button>
        </div>
    </div>
</div>

<script>
    let userData = {};
    let currentLang = 'am';
    const tg = window.Telegram.WebApp;
    tg.expand();

    // የቀለም ቲም መቀየሪያ (ባክግራውንድ እና ጽሁፍ ለየብቻ)
    function updateColors() {
        const bg = document.getElementById('bgPicker').value;
        const txt = document.getElementById('textPicker').value;
        
        document.documentElement.style.setProperty('--bg-color', bg);
        document.documentElement.style.setProperty('--card-bg', bg === '#0f172a' ? '#1e293b' : '#ffffff');
        document.documentElement.style.setProperty('--text-color', txt);
        document.documentElement.style.setProperty('--border-color', bg === '#0f172a' ? '#334155' : '#cbd5e1');
    }

    // የቋንቋ መዝገበ-ቃላት
    const translations = {
        am: {
            regTitle: "እንኳን ወደ መላ.ቦት በደህና መጡ",
            regSubtitle: "እባክዎ መረጃ በመሙላት ዋሌት ይክፈቱ",
            lblFirstName: "የራሱ ስም (First Name)",
            lblFatherName: "የአባት ስም (Father's Name)",
            lblPhone: "ስልክ ቁጥር (Phone Number)",
            btnNextWallet: "ቀጥል & ዋሌት ክፈት",
            kycTitle: "የማንነት ማረጋገጫ (KYC)",
            kycSubtitle: "መታወቂያ ፊትና ጀርባ ፎቶ ይጫኑ",
            lblFrontId: "የመታወቂያው ፊት (Front Photo)",
            lblBackId: "የመታወቂያው ጀርባ (Back Photo)",
            btnSubmitAdmin: "ለአድሚን ማረጋገጫ ላክ",
            pendingTitle: "ማረጋገጫ በመጠበቅ ላይ...",
            pendingSubtitle: "መረጃዎ ለአድሚን ተልኳል።",
            btnSimulate: "[ለሙከራ] ወደ ዋሌት ግባ",
            verificationBadge: "✅ ቬሪፋይድ ዋሌት",
            txtBalanceTitle: "አጠቃላይ ቀሪ ሂሳብ",
            btnDeposit: "ገንዘብ አስገባ (Chapa)",
            btnLottery: "ሎተሪ መቁረጥ",
            btnExchange: "መላ ኮይን / ዩኤስዲቲ መቀየሪያ",
            frontText: "ፎቶ ለመምረጥ እዚህ ይጫኑ",
            backText: "ፎቶ ለመምረጥ እዚህ ይጫኑ"
        },
        en: {
            regTitle: "Welcome to Mela-bot",
            regSubtitle: "Fill info to open a wallet",
            lblFirstName: "First Name",
            lblFatherName: "Father's Name",
            lblPhone: "Phone Number",
            btnNextWallet: "Continue & Open Wallet",
            kycTitle: "Identity Verification (KYC)",
            kycSubtitle: "Upload front and back ID photos",
            lblFrontId: "Front Photo of ID",
            lblBackId: "Back Photo of ID",
            btnSubmitAdmin: "Submit to Admin",
            pendingTitle: "Pending Verification...",
            pendingSubtitle: "Your info has been sent to admin.",
            btnSimulate: "[Test] Enter Wallet",
            verificationBadge: "✅ Verified Wallet",
            txtBalanceTitle: "Total Balance",
            btnDeposit: "Deposit (Chapa)",
            btnLottery: "Buy Lottery",
            btnExchange: "Mela Coin / USDT Converter",
            frontText: "Click to select photo",
            backText: "Click to select photo"
        }
    };

    function changeLanguage() {
        currentLang = document.getElementById('langSelect').value;
        const t = translations[currentLang];
        
        document.getElementById('regTitle').textContent = t.regTitle;
        document.getElementById('regSubtitle').textContent = t.regSubtitle;
        document.getElementById('lblFirstName').textContent = t.lblFirstName;
        document.getElementById('lblFatherName').textContent = t.lblFatherName;
        document.getElementById('lblPhone').textContent = t.lblPhone;
        document.getElementById('btnNextWallet').textContent = t.btnNextWallet;
        
        document.getElementById('kycTitle').textContent = t.kycTitle;
        document.getElementById('kycSubtitle').textContent = t.kycSubtitle;
        document.getElementById('lblFrontId').textContent = t.lblFrontId;
        document.getElementById('lblBackId').textContent = t.lblBackId;
        document.getElementById('btnSubmitAdmin').textContent = t.btnSubmitAdmin;
        
        document.getElementById('pendingTitle').textContent = t.pendingTitle;
        document.getElementById('pendingSubtitle').textContent = t.pendingSubtitle;
        document.getElementById('btnSimulate').textContent = t.btnSimulate;
        
        document.getElementById('verificationBadge').textContent = t.verificationBadge;
        document.getElementById('txtBalanceTitle').textContent = t.txtBalanceTitle;
        document.getElementById('btnDeposit').textContent = t.btnDeposit;
        document.getElementById('btnLottery').textContent = t.btnLottery;
        document.getElementById('btnExchange').textContent = t.btnExchange;
        
        document.getElementById('frontText').textContent = t.frontText;
        document.getElementById('backText').textContent = t.backText;
    }

    function handleRegister(event) {
        event.preventDefault();
        userData.firstName = document.getElementById('firstName').value;
        userData.fatherName = document.getElementById('fatherName').value;
        userData.phoneNumber = document.getElementById('phoneNumber').value;

        document.getElementById('step-register').classList.remove('active');
        document.getElementById('step-kyc').classList.add('active');
    }

    // ፎቶ ሲመረጥ ስልኩ እንዳይጨናነቅ (Freeze እንዳያደርግ) የሚረዳ
    function updateFileName(inputId, textId) {
        const input = document.getElementById(inputId);
        const textSpan = document.getElementById(textId);
        if (input.files && input.files.length > 0) {
            const fileName = input.files[0].name;
            textSpan.textContent = "✅ " + (fileName.length > 18 ? fileName.substring(0, 15) + "..." : fileName);
            textSpan.style.color = "var(--success-color)";
        }
    }

    function handleKyc(event) {
        event.preventDefault();
        document.getElementById('step-kyc').classList.remove('active');
        document.getElementById('step-pending').classList.add('active');
        
        if (tg && tg.sendData) {
            tg.sendData(JSON.stringify(userData));
        }
    }

    function simulatedAdminApprove() {
        document.getElementById('step-pending').classList.remove('active');
        document.getElementById('step-wallet').classList.add('active');
        document.getElementById('userDisplayName').textContent = `${userData.firstName || 'ሲቤ'} ${userData.fatherName || 'ግርማ'}`;
    }

    function openDepositModal() {
        let amount = prompt(currentLang === 'am' ? "ማስገባት የሚፈልጉትን የገንዘብ መጠን በ ETB ያስገቡ:" : "Enter deposit amount in ETB:");
        if (amount) {
            alert(currentLang === 'am' ? `የጠየቁት መጠን (${amount} ETB) በ Chapa ተጀምሯል!` : `Deposit of (${amount} ETB) initialized!`);
        }
    }

    function openLotterySection() {
        alert(currentLang === 'am' ? "ወደ ሎተሪ መቁረጫ ክፍል ተሸጋግረዋል!" : "Redirecting to lottery section!");
    }

    function openExchange() {
        alert(currentLang === 'am' ? "ወደ መላ ኮይን መቀየሪያ ገጽ ተሸጋግረዋል!" : "Redirecting to Mela Coin converter!");
    }
</script>

</body>
</html>
