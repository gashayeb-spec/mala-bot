<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>መላ ቦት (Mela Bot)</title>
    <style>
        body {
            background-color: #1e1b18;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: #2c2521;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h2 { text-align: center; color: #d4af37; }
        .card {
            background: #3b322c;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }
        .btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>መላ ቦት - Telegram Premium</h2>
    <div class="card">
        <p><b>ጥቅል:</b> 3 ወር (3 Months)</p>
        <p><b>መቀበያ:</b> ለራሴ (For yourself)</p>
        <p><b>ዩዘርኔም:</b> @Koket_X</p>
        <h3>ጠቅላላ ዋጋ: ETB 3599.00</h3>
    </div>

    <div class="card">
        <h3>የክፍያ አማራጮች</h3>
        <label><input type="radio" name="payment" checked> ቴሌቢር (Telebirr)</label><br><br>
        <label><input type="radio" name="payment"> የኪስ ቦርሳ (Wallet)</label><br><br>
        <label><input type="radio" name="payment"> ሲቢኢ ቢር (CBE Birr)</label>
    </div>

    <button class="btn" onclick="payNow()">ክፍያ ፈጽም ETB 3599.00</button>
</div>

<script>
    function payNow() {
        alert("የክፍያ ጥያቄዎ ተልኳል!");
    }
</script>

</body>
</html>
