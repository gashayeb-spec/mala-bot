<!DOCTYPE html>
<html lang="am" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>መላ ቦት - የጥቅል ምርጫ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f1016; color: #ffffff; font-family: sans-serif; }
    </style>
</head>
<body class="min-h-screen pb-24 flex flex-col justify-between">
    <header class="p-4 flex items-center justify-between border-b border-gray-800">
        <a href="index.html" class="text-purple-400 text-sm">‹ ተመለስ</a>
        <h1 class="text-sm font-bold">Telegram Stars</h1>
        <div class="text-xs text-purple-300">ዋሌት: 0.00 ብር</div>
    </header>

    <main class="p-4 space-y-4 max-w-md mx-auto w-full">
        <div class="border border-purple-500 bg-[#1a1b26] p-4 rounded-xl flex justify-between items-center cursor-pointer">
            <div>
                <h3 class="font-bold text-sm">50 Stars</h3>
                <p class="text-xs text-gray-400">ETB 300.00</p>
            </div>
            <input type="radio" checked class="accent-purple-500">
        </div>
        
        <button onclick="alert('ክፍያ ገጽ በቅርቡ ይገናኛል!')" class="w-full bg-amber-500 text-black font-bold py-3 rounded-xl mt-6">
            Continue to Payment · ETB 300.00
        </button>
    </main>
</body>
</html>
