<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mella Wallet - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: sans-serif; }
        .login-card { max-width: 400px; width: 100%; border-radius: 15px; border: none; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="card login-card p-4 shadow">
        <h3 class="text-center fw-bold mb-3 text-primary">💳 Mella Wallet</h3>
        <h5 class="text-center mb-4 text-muted">ወደ አካውንትዎ ይግቡ</h5>

        {% if error %}
            <div class="alert alert-danger p-2 small text-center">{{ error }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label font-weight-bold">የስልክ ቁጥር</label>
                <input type="text" name="phone" class="form-control" placeholder="09... ወይም +251..." required>
            </div>
            <div class="mb-3">
                <label class="form-label">ፓስወርድ</label>
                <input type="password" name="password" class="form-control" placeholder="******" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">ግባ (Login)</button>
        </form>

        <div class="text-center mt-4">
            <small class="text-muted">አዲስ አካውንት የሎትም? <a href="/register" class="text-decoration-none fw-bold">እዚህ ይመዝገቡ</a></small>
        </div>
    </div>
</body>
</html>
